name: Apply DadaProgressions docs refactor

on:
  push:
    branches:
      - docs/dadaprogressions-beta-26.5-wiki

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct documentation payload
        shell: bash
        run: |
          cat .docs-refactor-payload.part00 \
              .docs-refactor-payload.part01 \
              .docs-refactor-payload.part02 \
              .docs-refactor-payload.part03 \
              .docs-refactor-payload.part04 \
              .docs-refactor-payload.part05 > /tmp/dadadocu-refactor.b64
          base64 -d /tmp/dadadocu-refactor.b64 | tar -xz -C .
          rm .docs-refactor-payload.part00 \
             .docs-refactor-payload.part01 \
             .docs-refactor-payload.part02 \
             .docs-refactor-payload.part03 \
             .docs-refactor-payload.part04 \
             .docs-refactor-payload.part05
          rm .github/workflows/apply-dadaprogressions-docs.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Commit verified documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor DadaProgressions documentation for beta-26.5"
          git push origin "HEAD:${GITHUB_REF_NAME}"
